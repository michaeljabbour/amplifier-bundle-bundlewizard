[pytest]
# Exclude sub-bundle test directories that have their own pyproject.toml
# and pytest configurations. These are run independently, not as part of
# the repo-level suite.
#
# amplifier-bundle-superpowers: its tests/test_modes_adherence.py collides
#   by module name with tests/test_modes_adherence.py at the repo root
#   (both are rootdir-relative "test_modes_adherence" with no __init__.py).
#
# tool-mode: amplifier-bundle-modes/modules/tool-mode/tests/ has an
#   __init__.py that makes it a "tests" package, but its parent
#   directories are not on sys.path, causing ModuleNotFoundError at
#   collection time.
norecursedirs = .git .worktrees amplifier-bundle-superpowers tool-mode
