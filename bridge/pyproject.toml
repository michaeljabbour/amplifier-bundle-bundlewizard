[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bundlewizard-bridge"
version = "0.1.0"
description = "Bridge for Bundlewizard Amplifier sessions"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/bundlewizard_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
